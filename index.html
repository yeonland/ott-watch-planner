<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다봄 (Dabom) - 나의 시청 기록</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="header">
        <div class="header__logo">Dabom<span class="header__logo-dot">.</span></div>
        <div class="header__profile">
            <div class="header__avatar"></div>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1 class="hero__title">오늘 어떤 작품을<br><span class="hero__highlight">다봄</span> 하셨나요?</h1>
            <div class="search-bar">
                <i class="search-bar__icon fas fa-search"></i>
                <input class="search-bar__input" type="text" placeholder="영화, 드라마 제목 검색...">
            </div>
        </section>

        <section class="section section--watching">
            <div class="section__header">
                <h2 class="section__title">지금 시청 중 🍿</h2>
                <a href="#" class="section__more">더보기</a>
            </div>

            <div class="card-scroller">
                <div class="card">
                    <div class="card__poster">
                        <span class="card__tag">Netflix</span>
                    </div>
                    <div class="card__info">
                        <h3 class="card__title">오징어 게임 2</h3>
                        <div class="card__progress-info">
                            <span>Ep. 3 / 8</span>
                            <span>35%</span>
                        </div>
                        <div class="card__progress-bar">
                            <div class="card__progress-fill" style="width: 35%;"></div>
                        </div>
                        <button class="card__button">+ 1화 다봄</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card__poster">
                        <span class="card__tag">Disney+</span>
                    </div>
                    <div class="card__info">
                        <h3 class="card__title">무빙</h3>
                        <div class="card__progress-info">
                            <span>Ep. 12 / 20</span>
                            <span>60%</span>
                        </div>
                        <div class="card__progress-bar">
                            <div class="card__progress-fill" style="width: 60%;"></div>
                        </div>
                        <button class="card__button">+ 1화 다봄</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="section section--recent">
            <div class="section__header">
                <h2 class="section__title">최근 다봄 기록 ✅</h2>
            </div>

            <div class="record-list">
                <div class="record">
                    <div class="record__poster"></div>
                    <div class="record__info">
                        <h3 class="record__title">헤어질 결심</h3>
                        <span class="record__date">2026.02.14</span>
                    </div>
                    <div class="record__rating">★ 4.5</div>
                </div>

                <div class="record">
                    <div class="record__poster"></div>
                    <div class="record__info">
                        <h3 class="record__title">엘리멘탈</h3>
                        <span class="record__date">2026.02.10</span>
                    </div>
                    <div class="record__rating">★ 5.0</div>
                </div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <div class="bottom-nav__item bottom-nav__item--active"><i class="fas fa-home"></i></div>
        <div class="bottom-nav__item"><i class="fas fa-chart-bar"></i></div>
        <div class="bottom-nav__item"><i class="fas fa-user"></i></div>
    </nav>

</body>
</html>
